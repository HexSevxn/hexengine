[package]
name = "hexengine"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[dependencies]
wgpu = {version = "30.0.0", default-features = false, features = ["vulkan", "wgsl", "glsl", "std", "parking_lot"]}
winit = { version = "0.30.12", features = ["android-native-activity"] }
pollster = { version = "1.0.1" }
bytemuck = "1.24.0"
glam = "0.33.2"
uuid = {version = "1.18.1", features = ["v4"]}
rand = "0.10.2"
serde_json = "1.0.149"
oktree = "0.5.1"