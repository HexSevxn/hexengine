[package]
name = "hexengine"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[dependencies]
wgpu = {version = "30.0.2", default-features = false, features = ["vulkan", "wgsl", "glsl", "std", "parking_lot"]}
egui = {version = "0.37.0", features = ["default_fonts"]} #may need feature flags in future
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = "0.37.0"
winit = { version = "0.30.12", features = ["android-native-activity"] }
pollster = { version = "1.0.1" }
bytemuck = "1.24.0"
glam = "0.34.3"
uuid = {version = "1.29.2", features = ["v4"]}
rand = "0.10.3"
serde_json = "1.0.154"
serde = {version = "1.0.229", features = ["derive"]}